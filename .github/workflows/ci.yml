name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify Harness & Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # commit check --branch and scan --branch both resolve a merge base, and the
          # default depth of 1 has none. A gate that cannot resolve its range exits 2 and
          # reports that it could not run, which is correct and useless in CI.
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jq || true

      - name: Ensure ShellCheck is available
        run: |
          command -v shellcheck >/dev/null \
            || (sudo apt-get update && sudo apt-get install -y shellcheck) \
            || brew install shellcheck

      - name: Lint shell scripts (ShellCheck)
        run: |
          find bin core/scripts test -type f \
              \( -name '*.sh' -o -name 'harness' -o -name 'agh' -o -name 'agent-harness' \) -print0 \
            | xargs -0 shellcheck -S warning install.sh setup

      - name: Verify shell script syntax & skill frontmatter
        run: ./setup --verify

      - name: Scan this repository with its own landmine rules
        run: ./bin/harness scan --all

      - name: Validate this repository's own configuration
        run: ./bin/harness config validate

      - name: Check this branch's own commit messages
        # Against the pull request's base, not the trunk. A stacked branch legitimately
        # carries its parent's commits, and those belong to the parent's issue rather than
        # to this one -- so trunk..HEAD is the wrong range to hold to this branch's key.
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            ./bin/harness commit check --branch --base "origin/${{ github.base_ref }}"
          else
            ./bin/harness commit check --branch
          fi

      - name: Run automated test suite
        run: bash test/test_cli.sh

      - name: Run transaction library unit suite
        run: bash test/test_transaction_lib.sh

      - name: Run transactional installer suite
        run: bash test/test_install_transaction.sh
